<!DOCTYPE html>
<html>
<head>
    <title>MetroInfo Transit Realtime</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="script-src 'self' https://unpkg.com https://cdnjs.cloudflare.com https://www.googletagmanager.com;">
    <link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.5.1/dist/leaflet.css"
        integrity="sha512-xwE/Az9zrjBIphAcBb3F6JVqxf46+CDLwfLMHloNu6KEQCAWi6HcDUbeOfBIptF7tcCzusKFjFw2yuvEpDL9wQ=="
        crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.5.1/dist/leaflet.js"
        integrity="sha512-GffPMF3RvMeYyc1LWMHtK8EbPv0iNZ8/oTtHPx9/cc2ILxQ+u905qIwdpULaqDkyBKgOaB57QTMg7ztg8Jm2Og=="
        crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-providers@1.3.0/leaflet-providers.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"
        integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/spin.js/2.3.2/spin.min.js"></script>
    <script src="https://unpkg.com/leaflet-spin@1.1.0/leaflet.spin.min.js"></script>
    <script src="https://unpkg.com/leaflet-search@2.9.8/dist/leaflet-search.src.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.0.3/chroma.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-search@2.9.8/src/leaflet-search.css" />
    <style>
        body, html { width: 100%; height: 100%; margin: 0; padding: 0; }
        #map { position: absolute; width: 100%; height: 100%; left: 0; top: 0; }
        #title {
            position: absolute;
            top: 10px;
            left: 0; right: 0; margin: auto;
            z-index: 1000; width: 500px;
            text-align: center; color: white; border-radius: 5px; padding: 10px;
            background-color: rgba(0, 0, 0, 0.8);
            font-size: 1rem; font-family: Arial, Helvetica, sans-serif;
            text-shadow: 2px 2px #000000; font-weight: normal;
        }
        .info {
            background-color: white; padding: 15px; color: black;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2); border-radius: 5px;
        }
        #alerts {
            position: absolute;
            left: 58px;
            top: 82px;
            z-index: 1200;
            width: min(360px, calc(100% - 90px));
            max-height: 40vh;
            overflow: auto;
            background: rgba(0,0,0,0.72);
            color: white;
            border-radius: 8px;
            padding: 12px 14px;
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
        }
        #alerts h3 {
            margin: 0 0 8px 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .alert-item {
            background: rgba(255, 255, 255, 0.08);
            border-left: 3px solid #ffb703;
            padding: 8px 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 0.82rem;
            line-height: 1.4;
        }
        .alert-item strong {
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <h1 id="title">Welcome to the MetroInfo Transit Realtime Map!</h1>
    <div id="alerts">
        <h3>Service Alerts</h3>
        <div id="alerts-content">Loading…</div>
    </div>
    <div id="map"></div>
    <script>
        // Configuration - API key stays server-side in Vercel, not in the browser.
        var API_PROXY_BASE = '/api/metroinfo?path=';

        function metroProxyPath(path) {
            return API_PROXY_BASE + encodeURIComponent(path);
        }

        async function fetchJsonFromEndpoint(path, label) {
            const response = await fetch(metroProxyPath(path), {
                method: 'GET',
                headers: {
                    'Cache-Control': 'no-cache'
                }
            });

            if (!response.ok) {
                const text = await response.text();
                throw new Error(label + ' request failed: ' + response.status + ' ' + response.statusText + ' - ' + text);
            }

            const contentType = (response.headers.get('content-type') || '').toLowerCase();
            const rawText = await response.text();

            if (!rawText) {
                throw new Error(label + ' returned an empty response.');
            }

            if (contentType.includes('application/json') || rawText.trim().startsWith('{') || rawText.trim().startsWith('[')) {
                try {
                    return JSON.parse(rawText);
                } catch (err) {
                    throw new Error(label + ' returned invalid JSON: ' + err.message);
                }
            }

            throw new Error(label + ' returned a non-JSON response.');
        }

        async function fetchVehiclePositions() {
            const endpoints = [
                '/rti/gtfsrt/v1/vehicle-positions.pb'
            ];

            let lastError = null;
            for (const endpoint of endpoints) {
                try {
                    return await fetchJsonFromEndpoint(endpoint, 'Vehicle positions');
                } catch (err) {
                    lastError = err;
                    console.warn('Failed to load vehicle data from ' + endpoint + ':', err);
                }
            }

            throw lastError || new Error('Unable to load vehicle positions.');
        }

        async function fetchServiceAlerts() {
            const endpoints = [
                '/rti/gtfsrt/v1/service-alerts.pb'
            ];

            let lastError = null;
            for (const endpoint of endpoints) {
                try {
                    return await fetchJsonFromEndpoint(endpoint, 'Service alerts');
                } catch (err) {
                    lastError = err;
                    console.warn('Failed to load service alerts from ' + endpoint + ':', err);
                }
            }

            throw lastError || new Error('Unable to load service alerts.');
        }

        function renderAlerts(data) {
            const container = document.getElementById('alerts-content');
            if (!data || !data.entity || !Array.isArray(data.entity)) {
                container.textContent = 'No active alerts.';
                return;
            }

            const items = data.entity
                .filter(entity => entity.alert)
                .map(entity => {
                    const alert = entity.alert;
                    let title = 'Service alert';
                    let summary = 'No details provided.';

                    if (alert.header_text && alert.header_text.translation && alert.header_text.translation.length) {
                        title = alert.header_text.translation[0].text || title;
                    }

                    if (alert.description_text && alert.description_text.translation && alert.description_text.translation.length) {
                        summary = alert.description_text.translation[0].text || summary;
                    }

                    return '<div class="alert-item"><strong>' + title + '</strong>' + summary + '</div>';
                });

            container.innerHTML = items.length ? items.join('') : 'No active alerts.';
        }

        async function loadServiceAlerts() {
            try {
                const data = await fetchServiceAlerts();
                renderAlerts(data);
            } catch (err) {
                document.getElementById('alerts-content').textContent = 'Unable to fetch alerts.';
                console.error(err);
            }
        }

        // Christchurch center coordinates
        var map = L.map('map', {
            center: [-43.5321, 172.6362],
            zoom: 12,
            worldCopyJump: true
        });

        var positron = L.tileLayer.provider("OpenStreetMap.Mapnik").addTo(map);

        var baseMaps = {
            "OSM": positron,
            "OSM Grayscale": L.tileLayer.provider("OpenStreetMap.BlackAndWhite"),
            "CartoDB Positron": L.tileLayer.provider('CartoDB.Positron'),
            "CartoDB Dark Matter": L.tileLayer.provider("CartoDB.DarkMatter"),
            "ESRI WorldImagery": L.tileLayer.provider("Esri.WorldImagery"),
            "Google Hybrid": L.tileLayer('http://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
            }),
            "Wikimedia": L.tileLayer.provider("Wikimedia")
        };

        map.attributionControl.addAttribution("© <a href='https://metroinfo.co.nz/'>MetroInfo</a>");

        var busIcon = L.icon({
            iconUrl: 'metro-bus.png',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16],
            className: 'transit-marker bus-marker'
        });

        var tramIcon = L.icon({
            iconUrl: 'metro-tram.png',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16],
            className: 'transit-marker tram-marker'
        });

        var coachIcon = L.icon({
            iconUrl: 'metro-bus.png',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16],
            className: 'transit-marker coach-marker'
        });

        var otherIcon = L.icon({
            iconUrl: 'unknown-icon.png',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16],
            className: 'transit-marker other-marker'
        });

        var layers = {
            '3': L.layerGroup().addTo(map),    // Bus
            '1': L.layerGroup().addTo(map),    // Tram
            '2': L.layerGroup().addTo(map),    // Coach
            'null': L.layerGroup().addTo(map)  // Unknown
        };

        var search = L.control.search({
            layer: L.layerGroup([layers['3'], layers['1'], layers['2'], layers['null']]),
            initial: false,
            propertyName: 'desc'
        });
        map.addControl(search);

        $(document).on("keyup", ".search-input", function () {
            var searchVal = this.value.toLowerCase();
            for (var i in markers) {
                if (!markers.hasOwnProperty(i)) continue;
                var marker = markers[i];
                if (!searchVal || (marker.options.desc && marker.options.desc.toLowerCase().includes(searchVal))) {
                    marker.setStyle({ opacity: 1 });
                } else {
                    marker.setStyle({ opacity: 0 });
                }
            }
        });

        var overlayMaps = {
            "Buses": layers['3'],
            "Trams": layers['1'],
            "Coaches": layers['2'],
            "Unknown": layers['null']
        };

        L.control.layers(baseMaps, overlayMaps).addTo(map);

        var legend = L.control({ position: 'bottomright' });
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend');
            div.innerHTML = 'Colour by: <select id="colourscheme"><option>Route</option><option>Occupancy</option><option>Speed</option></select><div id="status"></div>';
            return div;
        };
        legend.addTo(map);

        $(document).on("change", "#colourscheme", function () {
            window.colourscheme = this.value;
            location.hash = this.value;
            for (var i in markers) {
                if (!markers.hasOwnProperty(i)) continue;
                updateMarkerColour(markers[i]);
            }
        });

        window.colourscheme = "Route";
        if (location.hash) {
            window.colourscheme = location.hash.slice(1);
            $("#colourscheme").val(window.colourscheme);
        }

        function stringToColour(str) {
            var hash = 0;
            for (var i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            var colour = '#';
            for (var i = 0; i < 3; i++) {
                var value = (hash >> (i * 8)) & 0xFF;
                colour += ('00' + value.toString(16)).substr(-2);
            }
            return colour;
        }

        function updateMarkerColour(marker) {
            var color = "black";
            if (window.colourscheme == "Route") {
                if (marker.route_type == 1) {
                    color = "red";
                } else if (marker.route_type == 2) {
                    color = "green";
                } else if (marker.route_long_name) {
                    color = stringToColour(marker.route_long_name);
                }
            } else if (window.colourscheme == "Occupancy" && marker.occupancy_status !== undefined) {
                color = occupancyColors[marker.occupancy_status];
            } else if (window.colourscheme == "Speed") {
                color = speedColors(marker.speed);
            }
            if (marker._icon && color !== "black") {
                marker._icon.style.filter = "hue-rotate(" + Math.random() * 360 + "deg)";
            }
        }

        function getIconForRouteType(routeType) {
            switch(routeType) {
                case 1: return tramIcon;
                case 2: return coachIcon;
                case 3: return busIcon;
                default: return otherIcon;
            }
        }

        var markers = {};
        var occupancy = ["empty", "many seats available", "few seats available", "standing room only", "limited standing room", "full", "not accepting passengers"];
        var occupancyColors = ["#4575b4", "#91bfdb", "#e0f3f8", "#fee090", "#fc8d59", "#d73027", "black"];
        var speedColors = chroma.scale([chroma.hsv(270, 1, 1), chroma.hsv(180, 1, 1), chroma.hsv(90, 1, 1), chroma.hsv(0, 1, 1)]).mode("hsv").domain([0, 100]);

        var hasLoaded = false;
        var routes = {};

        function safeId(input) {
            if (input === null || input === undefined) return "id";
            return String(input).replace(/[^a-zA-Z0-9_\-]/g, "_");
        }

        function bikeText(val) {
            if (val === null || val === undefined) return "Unknown";
            var n = parseInt(val, 10);
            if (isNaN(n)) return String(val);
            if (n === 1) return "Allowed";
            if (n === 2) return "Not allowed";
            return "Unknown";
        }

        function accessibilityText(val) {
            if (val === null || val === undefined) return "Unknown";
            var n = parseInt(val, 10);
            if (isNaN(n)) return String(val);
            if (n === 1) return "Accessible";
            if (n === 2) return "Not accessible";
            return "Unknown";
        }

        function removeMarkerFromLayer(marker) {
            if (marker && marker._map) {
                marker.remove();
            }
        }

        async function loadRoutes() {
            console.warn('No static route feed configured for this MetroInfo API. Continuing with realtime vehicle positions only.');
            loop();
            loadServiceAlerts();
        }

        async function loop() {
            if (hasLoaded && !document.hasFocus()) {
                console.log("tab unfocused, skipping");
                return;
            }
            hasLoaded = true;

            map.spin(true);
            try {
                const data = await fetchVehiclePositions();
                map.spin(false);

                if (!data || !data.entity || !Array.isArray(data.entity)) {
                    console.error("Unexpected vehicle positions response", data);
                    $("#status").text("Unexpected vehicle data.");
                    return;
                }

                var activeIds = {};

                for (var i in data.entity) {
                    if (!data.entity.hasOwnProperty(i)) continue;
                    var ent = data.entity[i];
                    var id = ent.id;
                    var vehicle = ent.vehicle;
                    if (!vehicle || !vehicle.position) continue;

                    activeIds[String(id)] = true;

                    var position = vehicle.position;
                    var label = vehicle.vehicle && vehicle.vehicle.label ? vehicle.vehicle.label : ("Vehicle " + id);
                    var desc = "<b>" + label + "</b><br>";
                    var layer = layers['null'];
                    var marker = markers[id];
                    var routeType = null;

                    var sid = safeId(id);

                    if (!marker) {
                        var icon = otherIcon;
                        if (vehicle.trip && vehicle.trip.route_id) {
                            var r = routes[vehicle.trip.route_id];
                            if (r) {
                                routeType = r.route_type;
                                icon = getIconForRouteType(routeType);
                            }
                        }

                        marker = L.marker([position.latitude || 0, position.longitude || 0], { 
                            icon: icon,
                            desc: desc,
                            opacity: 1
                        });
                        marker._entityId = id;
                        marker.route_type = routeType;
                        markers[id] = marker;
                    } else {
                        if (typeof position.latitude === "number" && typeof position.longitude === "number") {
                            marker.setLatLng([position.latitude, position.longitude]);
                        }
                        marker.options.desc = desc;
                    }

                    if (vehicle.trip && vehicle.trip.route_id) {
                        var r = routes[vehicle.trip.route_id];
                        marker.trip = vehicle.trip;
                        if (r) {
                            desc += "Route: " + (r.route_short_name || r.route_long_name) + "<br>Headsign: <div id='headsign-" + sid + "'></div>";
                            marker.options.desc = desc;
                            marker.route_long_name = r.route_long_name;
                            marker.route_type = r.route_type;
                            layer = layers[String(r.route_type)] || layers['null'];
                        } else {
                            layer = layers['null'];
                        }
                    }

                    if (marker._map) {
                        removeMarkerFromLayer(marker);
                    }
                    marker.addTo(layer);

                    marker.speed = Math.round(position.speed || 0);

                    var occupancyStatus = vehicle.occupancy_status || 0;
                    var tooltipHtml = desc +
                        "Speed: " + marker.speed + " km/h<br>" +
                        "Occupancy: " + (occupancy[occupancyStatus] || "Unknown") + "<br>" +
                        "License plate: " + (vehicle.vehicle.label) + "<br>" +
                        "Bike Enabled: <span id='bike_allowed-" + sid + "'>Unknown</span><br>" +
                        "Accessibility: <span id='accessibility-" + sid + "'>Unknown</span>";
                    
                    marker.bindTooltip(tooltipHtml);
                    marker.occupancy_status = occupancyStatus;
                    updateMarkerColour(marker);
                }

                // Remove stale markers no longer returned by the feed.
                for (var existingId in markers) {
                    if (!markers.hasOwnProperty(existingId)) continue;
                    if (!activeIds.hasOwnProperty(String(existingId))) {
                        removeMarkerFromLayer(markers[existingId]);
                        delete markers[existingId];
                    }
                }
            } catch (err) {
                map.spin(false);
                console.error(err);
                $("#status").text("Error loading vehicle locations: " + err.message);
            }
        }

        // Initial load
        loadRoutes();
        
        // Update every 10 seconds
        setInterval(loop, 10000);
        setInterval(loadServiceAlerts, 30000);
    </script>
</body>
</html>
